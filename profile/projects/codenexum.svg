<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#1c2333"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3178c6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="800" height="320" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#accent)"/>

  <text x="40" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">CodeNexum</text>
  <text x="40" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">Code index and context compression for opencode, exposed as MCP tools.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="40" y="130" width="200" height="64" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="140" y="157" text-anchor="middle" fill="#e6edf3">read / grep / glob / bash</text>
    <text x="140" y="177" text-anchor="middle" font-size="11" font-weight="400" fill="#8b949e">raw tool output</text>

    <rect x="300" y="130" width="200" height="64" rx="10" fill="#0d1117" stroke="#3178c6"/>
    <text x="400" y="157" text-anchor="middle" fill="#58a6ff">Index + compress</text>
    <text x="400" y="177" text-anchor="middle" font-size="11" font-weight="400" fill="#8b949e">FTS5 + BM25 in local SQLite</text>

    <rect x="560" y="130" width="200" height="64" rx="10" fill="#0d1117" stroke="#10b981"/>
    <text x="660" y="157" text-anchor="middle" fill="#34d399">Fewer tokens</text>
    <text x="660" y="177" text-anchor="middle" font-size="11" font-weight="400" fill="#8b949e">symbols, snippets, short logs</text>
  </g>

  <line x1="240" y1="162" x2="297" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="162" x2="557" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">
    <text x="40" y="240">Semantic summaries  ·  ANSI strip + line dedup  ·  callers / callees / impact analysis</text>
    <text x="40" y="262">Live React dashboard  ·  tray app (macOS, Windows, Linux)  ·  9 MCP tools</text>
  </g>
  <text x="40" y="296" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">TypeScript  ·  Electron  ·  React  ·  SQLite  ·  MIT</text>
</svg>
