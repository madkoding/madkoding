<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#1c2333"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00add8"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#accent)"/>

  <text x="40" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">super-shell-tui</text>
  <text x="40" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">Real interactive shells in tabs and split panes, built with Bubble Tea.</text>

  <!-- Terminal mock -->
  <rect x="40" y="108" width="720" height="170" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12">
    <rect x="40" y="108" width="720" height="26" rx="10" fill="#161b22"/>
    <rect x="52" y="116" width="74" height="18" rx="4" fill="#0d1117" stroke="#00add8"/>
    <text x="64" y="129" fill="#00add8">1 bash</text>
    <rect x="134" y="116" width="74" height="18" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="146" y="129" fill="#8b949e">2 build</text>
    <rect x="216" y="116" width="74" height="18" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="228" y="129" fill="#8b949e">3 logs</text>

    <line x1="400" y1="134" x2="400" y2="278" stroke="#30363d"/>
    <line x1="400" y1="206" x2="760" y2="206" stroke="#30363d"/>

    <text x="56" y="160" fill="#34d399">$</text><text x="70" y="160" fill="#e6edf3">go test ./...</text>
    <text x="56" y="180" fill="#8b949e">ok   internal/pty   0.412s</text>
    <text x="56" y="200" fill="#8b949e">ok   internal/ui    0.287s</text>
    <text x="56" y="220" fill="#34d399">$</text><text x="70" y="220" fill="#e6edf3">git status</text>
    <rect x="124" y="209" width="8" height="14" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="416" y="160" fill="#34d399">$</text><text x="430" y="160" fill="#e6edf3">tail -f app.log</text>
    <text x="416" y="180" fill="#8b949e">listening on :8080</text>
    <text x="416" y="228" fill="#34d399">$</text><text x="430" y="228" fill="#e6edf3">htop</text>
  </g>

  <text x="40" y="304" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">Go  ·  PTY passthrough  ·  9 tabs  ·  10,000-line scrollback with search  ·  session restore  ·  Linux and macOS</text>
</svg>
