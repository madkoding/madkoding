name: cleanup-artifacts

# Sweeps the Actions storage of every repository of the owner. The CI of the
# busiest repositories publishes one artifact per built platform on every
# push, so the storage grows by a few GB per day and is only reclaimed after
# the 90-day default retention expires.
#
# The token is a fine-grained PAT with "Actions: read and write" on every
# repository and nothing else: the built-in GITHUB_TOKEN cannot reach beyond
# the repository that runs the workflow.
on:
  schedule:
    # Every day at 03:23 UTC, off the hour to avoid the scheduled-workflow rush.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete artifacts older than this many days"
        required: false
        default: "7"
      cache_age_days:
        description: "Delete caches not accessed for this many days"
        required: false
        default: "30"

# Nothing at the workflow level: the job below asks for what it uses.
permissions: {}

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  purge:
    name: purge stale artifacts and caches
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Delete artifacts and caches past the retention window
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_CLEANUP_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          .github/scripts/purge-artifacts.sh \
            "${{ inputs.max_age_days || '7' }}" \
            "${{ inputs.cache_age_days || '30' }}"
