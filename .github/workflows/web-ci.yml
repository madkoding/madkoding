name: Web CI

on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml', 'readme.source.md']
  push:
    branches: [main]
    paths: ['web/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
